<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Organic Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Organic Shop</a>
                
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/shop">Shop</a></li>
                        <li><a href="/#categories">Categories</a></li>
                        <li><a href="/#about">About</a></li>
                    </ul>
                </nav>
                
                <div class="user-actions">
                    <a href="/cart" class="cart-icon">
                        🛒
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Register Form -->
    <div class="container" style="padding: 3rem 0;">
        <div class="form-container">
            <h2 class="text-center mb-2">Create Your Account</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required minlength="6">
                    <small style="color: var(--text-light);">Password must be at least 6 characters long</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span id="registerBtnText">Create Account</span>
                    <div id="registerLoader" class="loading hidden" style="display: inline-block; margin-left: 0.5rem;"></div>
                </button>
            </form>
            
            <div id="errorContainer" class="mt-2"></div>
            
            <div class="text-center mt-2">
                <p>Already have an account? <a href="/login" style="color: var(--primary-green); font-weight: 500;">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: var(--primary-green); color: white; text-align: center; padding: 2rem 0; margin-top: 3rem;">
        <div class="container">
            <p>&copy; 2024 Organic Shop. All rights reserved.</p>
            <p style="margin-top: 0.5rem; opacity: 0.8;">Fresh • Natural • Sustainable</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
