<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Organic Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Organic Shop</a>
                
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/shop">Shop</a></li>
                        <li><a href="/#categories">Categories</a></li>
                        <li><a href="/#about">About</a></li>
                    </ul>
                </nav>
                
                <div class="user-actions">
                    <a href="/cart" class="cart-icon">
                        🛒
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                    <div id="userMenu">
                        <a href="/login" class="btn btn-outline" id="loginBtn">Login</a>
                        <a href="/register" class="btn btn-primary" id="registerBtn">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Product Details -->
    <div class="container" style="padding: 2rem 0;">
        <div id="productContainer">
            <!-- Product details will be loaded here -->
        </div>
        
        <!-- Related Products -->
        <section style="margin-top: 4rem;">
            <h2 class="text-center mb-2">Related Products</h2>
            <div class="products-grid" id="relatedProducts">
                <!-- Related products will be loaded here -->
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer style="background: var(--primary-green); color: white; text-align: center; padding: 2rem 0; margin-top: 3rem;">
        <div class="container">
            <p>&copy; 2024 Organic Shop. All rights reserved.</p>
            <p style="margin-top: 0.5rem; opacity: 0.8;">Fresh • Natural • Sustainable</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
