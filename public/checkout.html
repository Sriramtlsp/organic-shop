<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Organic Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">Organic Shop</a>
                
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/shop">Shop</a></li>
                        <li><a href="/#categories">Categories</a></li>
                        <li><a href="/#about">About</a></li>
                    </ul>
                </nav>
                
                <div class="user-actions">
                    <a href="/cart" class="cart-icon">
                        🛒
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                    <div id="userMenu">
                        <a href="/login" class="btn btn-outline" id="loginBtn">Login</a>
                        <a href="/register" class="btn btn-primary" id="registerBtn">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Checkout Content -->
    <div class="container" style="padding: 2rem 0;">
        <h1 class="text-center mb-2">Checkout</h1>
        
        <div style="display: grid; grid-template-columns: 1fr 400px; gap: 2rem; align-items: start;">
            <!-- Checkout Form -->
            <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: var(--shadow);">
                <h3 style="margin-bottom: 1.5rem;">Shipping Information</h3>
                
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="street">Street Address</label>
                        <input type="text" id="street" class="form-control" required>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="state">State</label>
                            <input type="text" id="state" class="form-control" required>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="zipCode">ZIP Code</label>
                            <input type="text" id="zipCode" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country" class="form-control" value="India" required>
                        </div>
                    </div>
                    
                    <h3 style="margin: 2rem 0 1.5rem 0;">Payment Method</h3>
                    
                    <div class="form-group">
                        <div style="display: grid; gap: 1rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; padding: 1rem; border: 2px solid var(--border-light); border-radius: 5px; cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="upi" required>
                                <div>
                                    <div style="font-weight: 500;">UPI Payment</div>
                                    <div style="font-size: 0.9rem; color: var(--text-light);">Pay using UPI apps like Google Pay, PhonePe, Paytm</div>
                                </div>
                            </label>
                            
                            <label style="display: flex; align-items: center; gap: 0.5rem; padding: 1rem; border: 2px solid var(--border-light); border-radius: 5px; cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="card" required>
                                <div>
                                    <div style="font-weight: 500;">Credit/Debit Card</div>
                                    <div style="font-size: 0.9rem; color: var(--text-light);">Secure payment with your card</div>
                                </div>
                            </label>
                            
                            <label style="display: flex; align-items: center; gap: 0.5rem; padding: 1rem; border: 2px solid var(--border-light); border-radius: 5px; cursor: pointer;">
                                <input type="radio" name="paymentMethod" value="cod" required>
                                <div>
                                    <div style="font-weight: 500;">Cash on Delivery</div>
                                    <div style="font-size: 0.9rem; color: var(--text-light);">Pay when your order is delivered</div>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem;">
                        <span id="orderBtnText">Place Order</span>
                        <div id="orderLoader" class="loading hidden" style="display: inline-block; margin-left: 0.5rem;"></div>
                    </button>
                </form>
                
                <div id="errorContainer" class="mt-2"></div>
            </div>
            
            <!-- Order Summary -->
            <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: var(--shadow); position: sticky; top: 2rem;">
                <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>
                
                <div id="orderItems">
                    <!-- Order items will be loaded here -->
                </div>
                
                <hr style="margin: 1.5rem 0;">
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0.00</span>
                </div>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                    <span>Delivery:</span>
                    <span style="color: var(--success);">Free</span>
                </div>
                
                <hr style="margin: 1rem 0;">
                
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold;">
                    <span>Total:</span>
                    <span id="total">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: var(--primary-green); color: white; text-align: center; padding: 2rem 0; margin-top: 3rem;">
        <div class="container">
            <p>&copy; 2024 Organic Shop. All rights reserved.</p>
            <p style="margin-top: 0.5rem; opacity: 0.8;">Fresh • Natural • Sustainable</p>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
